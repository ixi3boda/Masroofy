<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Price charts · Egypt Prices</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 17l6-6 4 4 8-8' fill='none' stroke='%231b9e5a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* Same tokens as the main page; --series is the chart line (validated against each surface). */
  :root { --bg:#f7f6fb; --card:#ffffff; --text:#1b1b1f; --muted:#5f5d67; --line:#e2dfea; --grid:#eeecf3;
          --accent:#5b4bb0; --accent-soft:#ebe6fb; --series:#5b4bb0; --up:#1b8a50; --down:#c93c3c; --error:#ba1a1a;
          color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121116; --card:#1c1b21; --text:#e6e1e9; --muted:#a9a5b2; --line:#33313a; --grid:#2a2830;
            --accent:#c8bfff; --accent-soft:#3a3270; --series:#9483f5; --up:#4cc38a; --down:#ff7b72; --error:#ffb4ab;
            color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:15px; }
  button, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .app { max-width:1100px; margin:0 auto; padding:16px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:22px; margin:4px 0 8px; }
  .link { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 14px; color:inherit; text-decoration:none; }
  .muted { color:var(--muted); } .small { font-size:13px; } .error { color:var(--error); }
  .up { color:var(--up); } .down { color:var(--down); }
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto; }
  .tab { padding:10px 18px; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); font-weight:500; white-space:nowrap; }
  .tab[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }
  .filters { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:16px; }
  select { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 10px; max-width:100%; }
  .ranges { display:flex; gap:4px; }
  .chip { padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); font-variant-numeric:tabular-nums; }
  .chip[aria-pressed="true"] { background:var(--accent-soft); border-color:var(--accent); color:var(--text); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 24px; align-items:flex-end; margin-bottom:12px; }
  .head h2 { font-size:17px; margin:0 0 2px; }
  .price { font-size:28px; font-weight:700; margin:2px 0 0; }
  .change { font-weight:600; }
  .plot { position:relative; transition:opacity .15s; }
  .plot.loading { opacity:.45; }
  svg { display:block; width:100%; overflow:visible; }
  svg:focus { outline:none; }
  svg:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:4px; }
  .tick text { fill:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .tip { position:absolute; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:8px;
         padding:6px 10px; box-shadow:0 2px 8px rgba(0,0,0,.12); white-space:nowrap; display:none; }
  .tip .v { font-weight:600; font-variant-numeric:tabular-nums; }
  .tip .key { display:inline-block; width:12px; height:2px; background:var(--series); vertical-align:middle; margin-right:6px; border-radius:1px; }
  .empty { padding:48px 0; text-align:center; }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .toggle { border:0; background:none; color:var(--accent); padding:4px 0; font-weight:500; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-top:8px; }
  th { text-align:left; font-weight:500; color:var(--muted); font-size:13px; padding:4px 6px; border-bottom:1px solid var(--line); }
  td { padding:6px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  .num { text-align:right; white-space:nowrap; }
  .tablewrap { max-height:360px; overflow:auto; }
  .tablewrap.off, .foot[hidden] { display:none; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Price charts</h1>
    <a class="link" href="/">← Today's prices</a>
  </header>

  <nav class="tabs" role="tablist" id="kinds"></nav>

  <div class="filters">
    <label class="small muted">Item
      <select id="item" aria-label="Item"></select>
    </label>
    <div class="ranges" role="group" aria-label="Time range" id="ranges"></div>
  </div>

  <section class="card" id="card">
    <div class="head">
      <div>
        <h2 id="title">Loading…</h2>
        <div class="muted small" id="unit"></div>
      </div>
      <div style="text-align:right">
        <div class="price" id="last"></div>
        <div class="small"><span class="change" id="change"></span> <span class="muted" id="span"></span></div>
      </div>
    </div>
    <div class="plot" id="plot">
      <svg id="chart" role="img" tabindex="0" aria-label="Price chart"></svg>
      <div class="tip" id="tip"><div class="v"><span class="key"></span><span id="tipv"></span></div><div class="muted small" id="tipd"></div></div>
      <div class="empty muted" id="empty" hidden></div>
    </div>
    <div class="foot" id="foot">
      <span class="muted small" id="note">One price per day: the day's latest. Use ← → on the chart to step through days.</span>
      <button class="toggle" id="toggle" aria-expanded="false" aria-controls="tablewrap">Show table</button>
    </div>
    <div class="tablewrap" id="tablewrap" hidden>
      <table><thead><tr><th>Date</th><th class="num">Price (EGP)</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </section>
  <p class="muted small" id="error" role="alert"></p>
</main>

<script>
(() => {
  const KINDS = [
    { id: "gold", label: "Gold" }, { id: "silver", label: "Silver" },
    { id: "currencies", label: "Currencies" }, { id: "stocks", label: "Stocks" }];
  const RANGES = [["1M", 30], ["3M", 91], ["6M", 182], ["1Y", 365], ["All", Infinity]];
  const DAY = 86400000;
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";

  let groups = null;              // /api/prices answer
  let state = { kind: "gold", item: "21", range: "3M" };
  let points = [];                // all points of the selected item: [{t, date, price}]
  let shown = [];                 // points inside the range
  let active = -1;                // index in shown under the crosshair
  let geo = null;                 // scales of the last render
  let request = 0;

  // ---- formatting -------------------------------------------------------------------------
  function digits(v) { const a = Math.abs(v); return a >= 100000 ? 0 : a >= 1 ? 2 : 4; }
  function fmt(v, d = digits(v)) {
    return v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function axisFmt(v, step) {
    if (Math.abs(v) >= 10000) return (v / 1000).toLocaleString("en-US", { maximumFractionDigits: step >= 1000 ? 0 : 1 }) + "K";
    const d = step >= 1 ? 0 : Math.min(4, Math.ceil(-Math.log10(step)));
    return v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  const dayFmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  const shortFmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  const monthFmt = new Intl.DateTimeFormat("en-GB", { month: "short", year: "numeric", timeZone: "UTC" });
  const toT = s => Date.parse(s + "T00:00:00Z");

  function unitOf(kind, it) {
    if (kind === "currencies") return "EGP per 1 " + it.key;
    if (it.unit === "coin") return "EGP per coin";
    if (it.unit === "points") return "Index points";
    if (it.unit === "share") return "EGP per share";
    return "EGP per gram";
  }

  // ---- state in the address (#gold/21/3M), so a chart can be bookmarked ----------------------
  function readHash() {
    const [k, i, r] = decodeURIComponent(location.hash.slice(1)).split("/");
    if (KINDS.some(x => x.id === k)) state.kind = k;
    if (i) state.item = i;
    if (RANGES.some(x => x[0] === r)) state.range = r;
  }
  function writeHash() {
    history.replaceState(null, "", "#" + [state.kind, state.item, state.range].map(encodeURIComponent).join("/"));
  }

  // ---- controls -----------------------------------------------------------------------------
  function buildControls() {
    const kinds = $("kinds");
    kinds.replaceChildren();
    for (const k of KINDS) {
      const b = document.createElement("button");
      b.className = "tab"; b.setAttribute("role", "tab"); b.textContent = k.label;
      b.setAttribute("aria-selected", String(k.id === state.kind));
      b.onclick = () => { state.kind = k.id; state.item = null; fillItems(); loadItem(); };
      kinds.append(b);
    }
    const ranges = $("ranges");
    ranges.replaceChildren();
    for (const [label] of RANGES) {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = label;
      b.setAttribute("aria-pressed", String(label === state.range));
      b.onclick = () => { state.range = label; syncControls(); writeHash(); applyRange(); };
      ranges.append(b);
    }
    $("item").onchange = e => { state.item = e.target.value; loadItem(); };
  }

  function items() { return (groups && groups[state.kind] && groups[state.kind].items) || []; }

  function fillItems() {
    const list = items();
    if (!list.some(it => it.key === state.item)) state.item = list.length ? list[0].key : null;
    const sel = $("item");
    sel.replaceChildren();
    for (const it of list) {
      const o = document.createElement("option");
      o.value = it.key;
      o.textContent = it.name === it.key ? it.key : it.name + " (" + it.key + ")";
      sel.append(o);
    }
    sel.value = state.item || "";
    sel.disabled = list.length === 0;
    syncControls();
  }

  function syncControls() {
    [...$("kinds").children].forEach((b, i) => b.setAttribute("aria-selected", String(KINDS[i].id === state.kind)));
    [...$("ranges").children].forEach((b, i) => b.setAttribute("aria-pressed", String(RANGES[i][0] === state.range)));
  }

  // ---- data ---------------------------------------------------------------------------------
  async function getJson(url) {
    const r = await fetch(url, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error(url + " answered " + r.status);
    return r.json();
  }

  async function loadItem() {
    syncControls(); writeHash();
    const it = items().find(x => x.key === state.item);
    $("title").textContent = it ? (it.name === it.key ? it.key : it.name) : "No items yet";
    $("unit").textContent = it ? unitOf(state.kind, it) : "";
    if (!it) { points = []; applyRange(); return; }
    const mine = ++request;
    $("plot").classList.add("loading");           // keep the old chart while loading
    try {
      const url = "/api/history?kind=" + encodeURIComponent(state.kind) + "&item=" + encodeURIComponent(state.item);
      const data = await getJson(url);
      if (mine !== request) return;
      points = data.map(p => ({ t: toT(p.date), date: p.date, price: p.price }));
      $("error").textContent = "";
    } catch (e) {
      if (mine !== request) return;
      points = [];
      $("error").textContent = "Could not load the chart: " + e.message;
    } finally {
      if (mine === request) $("plot").classList.remove("loading");
    }
    applyRange();
  }

  function applyRange() {
    const days = RANGES.find(r => r[0] === state.range)[1];
    const end = points.length ? points[points.length - 1].t : 0;
    shown = days === Infinity ? points : points.filter(p => p.t > end - days * DAY);
    active = -1;
    renderHead(); render(); renderTable();
  }

  // ---- headline -----------------------------------------------------------------------------
  function renderHead() {
    const ch = $("change");
    ch.className = "change"; ch.textContent = ""; $("span").textContent = ""; $("last").textContent = "";
    if (!shown.length) return;
    const first = shown[0], last = shown[shown.length - 1];
    $("last").textContent = fmt(last.price);
    if (shown.length > 1) {
      const d = last.price - first.price, pct = first.price ? d / first.price * 100 : 0;
      const sign = d > 0 ? "+" : d < 0 ? "−" : "±";
      ch.textContent = (d > 0 ? "▲ " : d < 0 ? "▼ " : "") + sign + fmt(Math.abs(d)) + " (" + sign + Math.abs(pct).toFixed(2) + "%)";
      ch.className = "change " + (d > 0 ? "up" : d < 0 ? "down" : "muted");
      $("span").textContent = "since " + dayFmt.format(first.t);
    } else {
      $("span").textContent = dayFmt.format(last.t);
    }
  }

  // ---- chart --------------------------------------------------------------------------------
  function niceStep(span, count) {
    const raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }
  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.append(e);
    return e;
  }

  function render() {
    const svg = $("chart"), empty = $("empty");
    svg.replaceChildren(); hideTip(); geo = null;
    $("foot").hidden = shown.length === 0;
    $("tablewrap").classList.toggle("off", shown.length === 0);
    if (shown.length === 0) {
      svg.style.display = "none"; empty.hidden = false;
      empty.textContent = points.length === 0
          ? "No saved prices yet. The backend saves one price per day, so the chart fills in day by day."
          : "No prices in this range.";
      return;
    }
    svg.style.display = ""; empty.hidden = true;

    const W = Math.max(280, $("plot").clientWidth), H = W < 520 ? 240 : 320;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("height", H);

    // Y: clean ticks around the data (a price chart, so it need not start at zero).
    let lo = Math.min(...shown.map(p => p.price)), hi = Math.max(...shown.map(p => p.price));
    if (lo === hi) { const pad = Math.abs(lo) * 0.01 || 1; lo -= pad; hi += pad; }
    const step = niceStep(hi - lo, H < 300 ? 4 : 5);
    const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
    const ticks = [];
    for (let v = y0; v <= y1 + step / 2; v += step) ticks.push(+v.toPrecision(12));
    const labels = ticks.map(v => axisFmt(v, step));
    const left = 10 + Math.max(...labels.map(s => s.length)) * 7.2, right = 14, top = 10, bottom = 28;
    const iw = W - left - right, ih = H - top - bottom;

    const t0 = shown[0].t, t1 = shown[shown.length - 1].t;
    const x = t => t1 === t0 ? left + iw / 2 : left + (t - t0) / (t1 - t0) * iw;
    const y = v => top + (1 - (v - y0) / (y1 - y0)) * ih;

    // Gridlines and y labels (hairline, recessive).
    const grid = el("g", { class: "tick" }, svg);
    ticks.forEach((v, i) => {
      el("line", { x1: left, x2: W - right, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, grid);
      const tx = el("text", { x: left - 8, y: y(v), "text-anchor": "end", "dominant-baseline": "middle" }, grid);
      tx.textContent = labels[i];
    });
    el("line", { x1: left, x2: W - right, y1: top + ih, y2: top + ih, stroke: "var(--line)", "stroke-width": 1 }, grid);

    // X labels: a few evenly spaced dates that fit.
    const spanDays = (t1 - t0) / DAY, f = spanDays > 300 ? monthFmt : shortFmt;
    const nx = Math.max(1, Math.min(Math.floor(iw / 90), shown.length - 1, 6));
    const used = new Set();
    for (let i = 0; i <= nx; i++) {
      const idx = shown.length === 1 ? 0 : Math.round(i / nx * (shown.length - 1));
      if (used.has(idx)) continue; used.add(idx);
      const p = shown[idx], tx = el("text", { x: x(p.t), y: H - 8,
          "text-anchor": shown.length === 1 ? "middle" : i === 0 ? "start" : i === nx ? "end" : "middle" }, grid);
      tx.textContent = f.format(p.t);
    }

    // Area wash, then the 2px line, then the end dot with a surface ring.
    if (shown.length > 1) {
      const d = shown.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + "," + y(p.price).toFixed(1)).join("");
      el("path", { d: d + "L" + x(t1).toFixed(1) + "," + (top + ih) + "L" + x(t0).toFixed(1) + "," + (top + ih) + "Z",
                   fill: "var(--series)", "fill-opacity": 0.1, stroke: "none" }, svg);
      el("path", { d, fill: "none", stroke: "var(--series)", "stroke-width": 2,
                   "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    }
    const lastP = shown[shown.length - 1];
    el("circle", { cx: x(lastP.t), cy: y(lastP.price), r: 4, fill: "var(--series)", stroke: "var(--card)", "stroke-width": 2 }, svg);

    // Hover layer: crosshair + dot, snapped to the nearest day.
    const hover = el("g", { visibility: "hidden" }, svg);
    const cross = el("line", { y1: top, y2: top + ih, stroke: "var(--muted)", "stroke-width": 1 }, hover);
    const dot = el("circle", { r: 5, fill: "var(--series)", stroke: "var(--card)", "stroke-width": 2 }, hover);
    const hit = el("rect", { x: left, y: top, width: iw, height: ih, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      show(nearest(px));
    });
    hit.addEventListener("pointerleave", () => { if (document.activeElement !== svg) show(-1); });

    geo = { W, x, y, hover, cross, dot };
    svg.setAttribute("aria-label", $("title").textContent + ": " + shown.length + " days from " +
        dayFmt.format(t0) + " to " + dayFmt.format(t1) + ", last " + fmt(lastP.price) + ". Table view below.");
    if (active >= 0) show(Math.min(active, shown.length - 1));
  }

  function nearest(px) {
    let best = 0, bd = Infinity;
    shown.forEach((p, i) => { const d = Math.abs(geo.x(p.t) - px); if (d < bd) { bd = d; best = i; } });
    return best;
  }

  function show(i) {
    active = i;
    if (!geo || i < 0) { if (geo) geo.hover.setAttribute("visibility", "hidden"); hideTip(); return; }
    const p = shown[i], cx = geo.x(p.t), cy = geo.y(p.price);
    geo.hover.setAttribute("visibility", "visible");
    for (const a of ["x1", "x2"]) geo.cross.setAttribute(a, cx);
    geo.dot.setAttribute("cx", cx); geo.dot.setAttribute("cy", cy);
    $("tipv").textContent = fmt(p.price);
    $("tipd").textContent = dayFmt.format(p.t);
    const tip = $("tip"), svg = $("chart"), scale = svg.getBoundingClientRect().width / geo.W, pw = $("plot").clientWidth;
    tip.style.display = "block";
    const tw = tip.offsetWidth, px = cx * scale;
    tip.style.left = Math.max(0, Math.min(px + 12 + tw > pw ? px - tw - 12 : px + 12, pw - tw)) + "px";
    tip.style.top = Math.max(0, cy * scale - tip.offsetHeight - 10) + "px";
  }
  function hideTip() { $("tip").style.display = "none"; }

  // Keyboard: the same readout as hover.
  $("chart").addEventListener("keydown", e => {
    if (!shown.length) return;
    const k = e.key;
    let i = active < 0 ? shown.length - 1 : active;
    if (k === "ArrowLeft") i = Math.max(0, i - 1);
    else if (k === "ArrowRight") i = Math.min(shown.length - 1, i + 1);
    else if (k === "Home") i = 0;
    else if (k === "End") i = shown.length - 1;
    else return;
    e.preventDefault(); show(i);
  });
  $("chart").addEventListener("focus", () => { if (shown.length && active < 0) show(shown.length - 1); });
  $("chart").addEventListener("blur", () => show(-1));

  // ---- table view (every value without hovering) ----------------------------------------------
  function renderTable() {
    const body = $("rows");
    body.replaceChildren();
    for (let i = shown.length - 1; i >= 0; i--) {
      const tr = document.createElement("tr"), a = document.createElement("td"), b = document.createElement("td");
      a.textContent = dayFmt.format(shown[i].t);
      b.className = "num"; b.textContent = fmt(shown[i].price);
      tr.append(a, b); body.append(tr);
    }
  }
  $("toggle").onclick = () => {
    const w = $("tablewrap"), open = w.hidden;
    w.hidden = !open;
    $("toggle").textContent = open ? "Hide table" : "Show table";
    $("toggle").setAttribute("aria-expanded", String(open));
  };

  // ---- start ----------------------------------------------------------------------------------
  let resizeTimer;
  new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 60); }).observe($("plot"));
  window.addEventListener("hashchange", () => { readHash(); fillItems(); loadItem(); });

  readHash();
  buildControls();
  getJson("/api/prices")
    .then(p => { groups = p; fillItems(); loadItem(); })
    .catch(e => { $("title").textContent = "Could not load prices"; $("error").textContent = e.message; });
})();
</script>
</body>
</html>
