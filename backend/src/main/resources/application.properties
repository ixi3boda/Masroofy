spring.application.name=finance-backend
server.port=${PORT:8080}

# --- Database: PostgreSQL ----------------------------------------------------
# Change these here, or set DB_URL, DB_USERNAME (or DB_USER) and DB_PASSWORD as environment variables.
# The tables are created on the first start. fx_rates, stock_prices and metal_prices hold the newest
# price of everything; price_history keeps one price per item per day, for the charts.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${DB_USERNAME:${DB_USER:finance}}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Update schedule ------------------------------------------------------
# sec min hour day month weekday -> 09:00, 15:00 and 21:00 every day.
# "zone" keeps it on Cairo time (summer time included) whatever the server's timezone.
app.update.cron=0 0 9-21/6 * * *
app.update.zone=Africa/Cairo
# Also run once when the server starts, so a fresh install has data straight away.
app.update.on-startup=true

# --- Sources ----------------------------------------------------------------
# Exchange rates: every currency from the AllRatesToday daily reference rate (free, no key).
# One table per day, sampled at 16:00 London, base USD; the app turns it into EGP per 1 unit.
# Terms: public pages that show the rates need a visible link to allratestoday.com.
app.fx.allrates-url=https://allratestoday.com/api/open/reference-rate
# Check each ticker on Yahoo Finance before relying on it (Yahoo data is unofficial).
# Yahoo and EGX are asked for this many days back to find the last session; only the newest is kept.
app.stocks.days=30
app.stocks.tickers=COMI.CA,TMGH.CA,EAST.CA,SWDY.CA,HRHO.CA,ETEL.CA
app.stocks.indices=EGX30
# Today's prices from TradingView (works when Yahoo blocks us).
app.stocks.tradingview=true

# Gold and silver: world prices from gold-api.com (https://api.gold-api.com/price/XAU and /XAG),
# turned into EGP per gram with the US Dollar rate above.

