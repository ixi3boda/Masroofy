spring:
  application:
    name: masroofy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/masroofy}
    username: ${DB_USERNAME:masroofy}
    password: ${DB_PASSWORD:masroofy}
    hikari:
      # Fail fast (503 SERVICE_UNAVAILABLE) when PostgreSQL is down instead of holding the request for 30 s.
      connection-timeout: 5000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: true
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP problems surface as EMAIL_DELIVERY_FAILED on the request; they must not mark the API as down
    # (and with app.mail.provider=log there is no SMTP server to check at all).
    mail:
      enabled: false

app:
  firebase:
    # Path to the Firebase service-account JSON. Leave empty to use Application Default Credentials.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    # Alternative to the path: the whole service-account JSON, base64-encoded.
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    project-id: ${FIREBASE_PROJECT_ID:}
    # Web API key (Project settings > General). Used for email/password sign-in and token refresh.
    web-api-key: ${FIREBASE_WEB_API_KEY:}
    # When true, every request checks that the ID token was not revoked (makes logout immediate).
    check-revoked: true
    identity-toolkit-base-url: https://identitytoolkit.googleapis.com
    secure-token-base-url: https://securetoken.googleapis.com
  auth:
    # Secret used to HMAC verification codes and reset tokens before they are stored. Min 32 chars.
    code-secret: ${AUTH_CODE_SECRET:}
    code-length: 6
    code-ttl: 10m
    max-code-attempts: 5
    resend-cooldown: 60s
    reset-token-ttl: 15m
  mail:
    # smtp = send real emails; log = print codes to the log (local development only)
    provider: ${MAIL_PROVIDER:smtp}
    # Empty = send as MAIL_USERNAME (required by Gmail unless you added a verified "Send mail as" alias).
    from: ${MAIL_FROM:}
    from-name: Masroofy
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
