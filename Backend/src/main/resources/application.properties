spring.application.name=masroofy-backend
server.port=8080

# ---------------- PostgreSQL ----------------
# Create the database once:  createdb -U postgres masroofy   (or in pgAdmin / psql: CREATE DATABASE masroofy;)
# Override any of these with environment variables DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/masroofy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Creates the "transactions" table on first start and adds new columns later. It never drops anything.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------- Python voice service ----------------
# uvicorn voice_expense.api:app --host 127.0.0.1 --port 8000   (exactly this URL: nothing after the port)
voice.service.url=${VOICE_SERVICE_URL:http://localhost:8000}
voice.service.connect-timeout-ms=5000
# Whisper on CPU can take several seconds; the very first request also loads the model.
voice.service.read-timeout-ms=120000

# Recordings up to 10 MB (the Python service has the same limit).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---------------- API ----------------
# JSON uses snake_case (transaction_type, payment_method...) like the Python service.
spring.jackson.property-naming-strategy=SNAKE_CASE
# "Today" for transactions saved without a date.
app.timezone=Africa/Cairo
# Only matters for the Expo web build (phones do not use CORS). Restrict before deploying.
app.cors.allowed-origins=*
