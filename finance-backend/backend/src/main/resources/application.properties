spring.application.name=finance-backend
server.port=8080

# --- Database: PostgreSQL ----------------------------------------------------
# Change these here, or set DB_URL, DB_USER and DB_PASSWORD as environment variables.
# The tables (fx_rates, stock_prices, gold_prices) are created on the first start.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance}
spring.datasource.username=${DB_USER:finance}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Update schedule ------------------------------------------------------
# sec min hour day month weekday -> 09:00, 15:00 and 21:00 every day.
# "zone" keeps it on Cairo time (summer time included) whatever the server's timezone.
app.update.cron=0 0 9-21/6 * * *
app.update.zone=Africa/Cairo
# Also run once when the server starts, so a fresh install has data straight away.
app.update.on-startup=true

# --- Sources ----------------------------------------------------------------
app.fx.days=7
app.fx.currencies=US Dollar,Euro,Pound Sterling,Canadian Dollar,Swedish Krona,Swiss Franc,Japanese Yen 100
# Check each ticker on Yahoo Finance before relying on it (Yahoo data is unofficial).
app.stocks.days=30
app.stocks.tickers=COMI.CA,TMGH.CA,EAST.CA,SWDY.CA,HRHO.CA,ETEL.CA
app.stocks.indices=EGX30
# Today's prices from TradingView (works when Yahoo blocks us; history builds up day by day).
app.stocks.tradingview=true

# Gold and silver: world prices from gold-api.com (https://api.gold-api.com/price/XAU and /XAG),
# turned into EGP per gram with the CBE US Dollar rate.
